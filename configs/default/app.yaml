# ==============================================================================
# Application Server Configuration
# ==============================================================================

app:
  name: "AI Exam Control - ARGUS Proctoring Engine"
  version: "2.0.0"
  env: "production"
  host: "0.0.0.0"
  port: 8000
  log_level: "info"
  max_latency_ms: 150
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://localhost:5173"
  device: "auto" # options: auto, cuda, cpu
  enable_docs: true
